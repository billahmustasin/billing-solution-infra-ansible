---
# Install node_exporter and postgres_exporter on Patroni VMs.
# PgBouncer is not in the application path, so its exporter is not installed.
# Metrics listen on all interfaces; firewalld allows 172.17.0.0/16 only.

- name: Create prometheus system user
  user:
    name: prometheus
    system: yes
    shell: /sbin/nologin
    home: /var/lib/prometheus
    create_home: yes

- name: Download exporter tarballs
  get_url:
    url: "{{ item.url }}"
    dest: "/tmp/{{ item.file }}"
    timeout: 120
  loop:
    - file: "node_exporter-{{ node_exporter_version }}.{{ exporter_arch }}.tar.gz"
      url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ exporter_arch }}.tar.gz"
    - file: "postgres_exporter-{{ postgres_exporter_version }}.{{ exporter_arch }}.tar.gz"
      url: "https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ postgres_exporter_version }}/postgres_exporter-{{ postgres_exporter_version }}.{{ exporter_arch }}.tar.gz"

- name: Extract exporters
  unarchive:
    src: "/tmp/{{ item }}"
    dest: /tmp
    remote_src: yes
  loop:
    - "node_exporter-{{ node_exporter_version }}.{{ exporter_arch }}.tar.gz"
    - "postgres_exporter-{{ postgres_exporter_version }}.{{ exporter_arch }}.tar.gz"

- name: Install exporter binaries
  copy:
    src: "{{ item.src }}"
    dest: "{{ exporter_install_dir }}/{{ item.dest }}"
    remote_src: yes
    owner: root
    group: root
    mode: "0755"
  loop:
    - src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ exporter_arch }}/node_exporter"
      dest: node_exporter
    - src: "/tmp/postgres_exporter-{{ postgres_exporter_version }}.{{ exporter_arch }}/postgres_exporter"
      dest: postgres_exporter

- name: Postgres exporter environment
  template:
    src: postgres_exporter.env.j2
    dest: /etc/default/postgres_exporter
    owner: prometheus
    group: prometheus
    mode: "0640"

- name: Stop PgBouncer exporter if a previous install left it running
  service:
    name: pgbouncer_exporter
    state: stopped
    enabled: no
  failed_when: false

- name: Systemd units
  template:
    src: exporter.service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    mode: "0644"
  loop:
    - name: node_exporter
      exec: "{{ exporter_install_dir }}/node_exporter --web.listen-address=:9100"
    - name: postgres_exporter
      exec: "{{ exporter_install_dir }}/postgres_exporter --web.listen-address=:9187"
  notify: Reload systemd

- name: Enable and start exporters
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
    daemon_reload: yes
  loop:
    - node_exporter
    - postgres_exporter

- name: Open exporter ports from the 172.17.0.0/16 fabric
  command: >
    firewall-cmd --permanent --add-rich-rule='rule family=ipv4 source address={{ exporter_listen_source }}
    port port={{ item }} protocol=tcp accept'
  register: fw_perm
  changed_when: fw_perm.rc == 0
  failed_when: false
  loop:
    - "9100"
    - "9187"
    - "8404"
    - "8008"

- name: Apply exporter firewall rules now
  command: >
    firewall-cmd --add-rich-rule='rule family=ipv4 source address={{ exporter_listen_source }}
    port port={{ item }} protocol=tcp accept'
  changed_when: false
  failed_when: false
  loop:
    - "9100"
    - "9187"
    - "8404"
    - "8008"
