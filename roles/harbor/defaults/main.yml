---
harbor_version: "2.14.4"
harbor_install_dir: /opt/harbor
harbor_data_volume: /data/harbor
harbor_hostname: "{{ ansible_default_ipv4.address }}"

harbor_https_port: 443
harbor_ssl_dir: "{{ harbor_install_dir }}/certs"
harbor_ssl_cert: "{{ harbor_ssl_dir }}/harbor.crt"
harbor_ssl_key: "{{ harbor_ssl_dir }}/harbor.key"
harbor_ssl_days: 3650

# Default admin user is "admin"
# Set harbor_admin_password / harbor_db_password in group_vars/harbor/vault.yml

harbor_installer_base: "https://github.com/goharbor/harbor/releases/download/v{{ harbor_version }}"
harbor_installer_archive: "harbor-online-installer-v{{ harbor_version }}.tgz"

# Kernel modules Docker needs on RHEL 10 (from kernel-modules-extra)
harbor_kernel_modules:
  - overlay
  - br_netfilter
  - xt_addrtype

