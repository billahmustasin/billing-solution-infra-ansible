# roles/minio/tasks/main.yml
---
- name: Install prerequisites
  dnf:
    name:
      - curl
    state: present
    update_cache: yes

- name: Create minio system user
  user:
    name: "{{ minio_user }}"
    system: yes
    shell: /sbin/nologin
    home: "{{ minio_data_dir | dirname }}"
    create_home: no

- name: Create minio directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: '0750'
  loop:
    - "{{ minio_config_dir }}"
    - "{{ minio_data_dir }}"
    - "{{ minio_log_dir }}"

- name: Download MinIO server binary
  get_url:
    url: "{{ minio_download_url }}"
    dest: "{{ minio_bin_dir }}/minio"
    mode: '0755'
    timeout: 120

- name: Download MinIO client (mc)
  get_url:
    url: "{{ minio_mc_download_url }}"
    dest: "{{ minio_bin_dir }}/mc"
    mode: '0755'
    timeout: 120

- name: Configure MinIO environment
  template:
    src: minio.env.j2
    dest: "{{ minio_config_dir }}/minio.env"
    owner: root
    group: "{{ minio_group }}"
    mode: '0640'
  notify: Restart minio

- name: Install MinIO systemd unit
  template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart minio

- name: Reload systemd
  meta: flush_handlers

- name: Restore SELinux contexts on minio paths
  command: restorecon -Rv {{ item }}
  loop:
    - "{{ minio_config_dir }}"
    - "{{ minio_data_dir }}"
    - "{{ minio_log_dir }}"
    - "{{ minio_bin_dir }}/minio"
  changed_when: false
  failed_when: false
  when: ansible_selinux.status == 'enabled'

- name: Enable and start MinIO
  service:
    name: minio
    state: started
    enabled: yes

- name: Wait for MinIO API port to listen
  wait_for:
    host: 127.0.0.1
    port: "{{ minio_api_port }}"
    delay: 5
    timeout: 120
    state: started

- name: Wait for MinIO console port to listen
  wait_for:
    host: 127.0.0.1
    port: "{{ minio_console_port }}"
    delay: 5
    timeout: 60
    state: started

- name: Verify MinIO health endpoint
  uri:
    url: "http://127.0.0.1:{{ minio_api_port }}/minio/health/live"
    method: GET
    status_code: 200
  register: minio_health
  until: minio_health.status == 200
  retries: 12
  delay: 5
